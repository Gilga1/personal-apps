[package]
name = "stacks"
version = "0.1.0"
description = "Stacks — local-first music player"
authors = ["shobhit"]
edition = "2021"

[lib]
name = "stacks_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "stacks"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "stacks-server"
path = "src/bin/stacks_server.rs"
required-features = ["server"]

[features]
default = ["desktop"]
desktop = ["tauri", "tauri-plugin-opener", "tauri-plugin-dialog", "tauri-build"]
server = ["axum", "tower-http", "tower"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
walkdir = "2"
lofty = "0.22"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util"] }
dirs = "6"
thiserror = "2"
regex = "1"

# Desktop (Tauri)
tauri = { version = "2", features = ["protocol-asset"], optional = true }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }

# Server (Docker / web)
axum = { version = "0.8", optional = true, features = ["multipart"] }
tower-http = { version = "0.6", optional = true, features = ["cors", "fs", "trace"] }
tower = { version = "0.5", optional = true }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
