# Render Blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: thaliscan-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: NVIDIA_API_KEY
        sync: false
      - key: VISION_MODEL
        value: nvidia/nemotron-3-nano-omni-30b-a3b-reasoning
      - key: VISION_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: NOTION_API_KEY
        sync: false
      - key: NOTION_MEALS_DATABASE_ID
        value: 45a56aaa1c6a441ab6f82b01ac9ca2b7
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: thaliscan-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE
        fromService:
          type: web
          name: thaliscan-api
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
